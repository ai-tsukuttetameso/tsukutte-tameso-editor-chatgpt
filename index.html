<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ブラウザだけで使える、シンプルな日本語テキストエディタです。">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>つくってためそ メモ帳</title>
  <style>
    :root {
      color-scheme: light;
      --border: #d7d7d7;
      --border-strong: #b8b8b8;
      --bar: #f4f4f4;
      --bar-hover: #e7e7e7;
      --accent: #1769aa;
      --accent-soft: #e8f2fb;
      --text: #1f1f1f;
      --muted: #646464;
      --danger: #a12424;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ececec;
      color: var(--text);
      font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select,
    input[type="text"],
    input[type="number"] {
      min-height: 34px;
    }

    button {
      color: inherit;
    }

    .app-shell {
      display: grid;
      grid-template-rows: 38px 36px minmax(0, 1fr) auto auto;
      width: min(1180px, 100%);
      height: 100dvh;
      margin: 0 auto;
      background: #fff;
      border-inline: 1px solid var(--border);
      box-shadow: 0 0 28px rgba(0, 0, 0, 0.08);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .app-mark {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--border-strong);
      border-radius: 3px;
      background: linear-gradient(135deg, #ffffff 0 55%, #e5f0f8 55% 100%);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .app-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menubar {
      display: flex;
      align-items: stretch;
      gap: 1px;
      padding-inline: 6px;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .menu {
      position: relative;
    }

    .menu-trigger {
      height: 100%;
      min-height: 0;
      padding: 0 12px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu-trigger:hover,
    .menu-trigger[aria-expanded="true"] {
      background: var(--bar-hover);
    }

    .menu-panel {
      position: absolute;
      z-index: 20;
      top: calc(100% - 2px);
      left: 0;
      display: none;
      width: max-content;
      min-width: 250px;
      padding: 5px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
    }

    .menu.open .menu-panel {
      display: block;
    }

    .menu-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: center;
      width: 100%;
      min-height: 34px;
      padding: 5px 10px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      background: var(--accent-soft);
      outline: 1px solid #b9d5ec;
    }

    .shortcut {
      color: var(--muted);
      font-size: 12px;
    }

    .menu-separator {
      height: 1px;
      margin: 5px 4px;
      background: var(--border);
    }

    .check-mark {
      display: inline-block;
      width: 1.2em;
      font-weight: 700;
    }

    .editor-wrap {
      position: relative;
      min-height: 0;
      background: #fff;
    }

    #editor {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 14px 16px;
      resize: none;
      border: 0;
      outline: none;
      background: #fff;
      color: #111;
      font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      tab-size: 4;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      overflow-x: hidden;
      caret-color: #111;
    }

    #editor.no-wrap {
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
    }

    #editor::selection {
      background: #b9d9f2;
    }

    .statusbar {
      display: flex;
      align-items: center;
      min-height: 30px;
      border-top: 1px solid var(--border);
      background: var(--bar);
      color: #3c3c3c;
      font-size: 12px;
      user-select: none;
    }

    .status-item {
      min-width: 128px;
      padding: 4px 12px;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }

    .status-item:first-child {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .disclaimer {
      padding: 5px 10px calc(5px + var(--safe-bottom));
      border-top: 1px solid #e7e7e7;
      background: #fafafa;
      color: #757575;
      font-size: 10px;
      line-height: 1.4;
      text-align: center;
    }

    dialog {
      width: min(460px, calc(100vw - 24px));
      max-height: calc(100dvh - 28px);
      padding: 0;
      overflow: auto;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.28);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.28);
    }

    .dialog-title {
      margin: 0;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bar);
      font-size: 15px;
    }

    .dialog-body {
      display: grid;
      gap: 13px;
      padding: 16px;
    }

    .field {
      display: grid;
      gap: 6px;
      font-size: 13px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--border-strong);
      border-radius: 3px;
      background: #fff;
    }

    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 10px;
      align-items: end;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px 16px;
    }

    .dialog-actions button,
    .action-button {
      min-width: 82px;
      padding: 6px 13px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }

    .dialog-actions button:hover,
    .action-button:hover {
      background: var(--bar-hover);
    }

    .dialog-actions .primary {
      border-color: #0c5c95;
      background: var(--accent);
      color: #fff;
    }

    .dialog-actions .primary:hover {
      background: #0f5d95;
    }

    .dialog-note {
      min-height: 1.4em;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .dialog-note.error {
      color: var(--danger);
    }

    .font-preview {
      min-height: 82px;
      padding: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #fff;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      z-index: 40;
      right: 18px;
      bottom: calc(58px + var(--safe-bottom));
      max-width: min(360px, calc(100vw - 28px));
      padding: 10px 14px;
      border: 1px solid #a8c6dc;
      border-radius: 5px;
      background: #f3f9fd;
      color: #24475e;
      font-size: 12px;
      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.13);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    @media (max-width: 560px) {
      .app-shell {
        grid-template-rows: 38px 39px minmax(0, 1fr) auto auto;
        border-inline: 0;
      }

      .menubar {
        overflow-x: auto;
        padding-inline: 2px;
      }

      .menu-trigger {
        padding-inline: 13px;
        white-space: nowrap;
      }

      .menu-panel {
        position: fixed;
        top: 76px;
        left: 6px;
        right: 6px;
        width: auto;
        min-width: 0;
      }

      #editor {
        padding: 12px;
        font-size: 16px;
      }

      .statusbar {
        overflow-x: auto;
      }

      .status-item {
        min-width: auto;
        flex: 0 0 auto;
        padding-inline: 9px;
      }

      .status-item:first-child {
        max-width: 42vw;
      }

      .disclaimer {
        padding-inline: 6px;
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .dialog-actions button {
        flex: 1 1 45%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell" aria-label="つくってためそ メモ帳">
    <header class="titlebar">
      <span class="app-mark" aria-hidden="true">文</span>
      <span class="app-title" id="windowTitle">無題.txt - つくってためそ メモ帳</span>
    </header>

    <nav class="menubar" aria-label="メインメニュー">
      <div class="menu">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">ファイル</button>
        <div class="menu-panel" role="menu">
          <button class="menu-item" type="button" role="menuitem" data-action="new"><span>新規作成</span><span class="shortcut">Ctrl+N</span></button>
          <button class="menu-item" type="button" role="menuitem" data-action="open"><span>ファイルを開く</span><span class="shortcut">Ctrl+O</span></button>
          <button class="menu-item" type="button" role="menuitem" data-action="save"><span>保存</span><span class="shortcut">Ctrl+S</span></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">編集</button>
        <div class="menu-panel" role="menu">
          <button class="menu-item" type="button" role="menuitem" data-action="undo"><span>元に戻す</span><span class="shortcut">Ctrl+Z</span></button>
          <button class="menu-item" type="button" role="menuitem" data-action="redo"><span>やり直し</span><span class="shortcut">Ctrl+Y</span></button>
          <div class="menu-separator" role="separator"></div>
          <button class="menu-item" type="button" role="menuitem" data-action="find"><span>検索</span><span class="shortcut">Ctrl+F</span></button>
          <button class="menu-item" type="button" role="menuitem" data-action="replace"><span>置換</span><span class="shortcut">Ctrl+H</span></button>
          <div class="menu-separator" role="separator"></div>
          <button class="menu-item" type="button" role="menuitem" data-action="selectAll"><span>すべて選択</span><span class="shortcut">Ctrl+A</span></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">表示</button>
        <div class="menu-panel" role="menu">
          <button class="menu-item" type="button" role="menuitem" data-action="font"><span>フォントと文字サイズ</span><span></span></button>
          <button class="menu-item" type="button" role="menuitemcheckbox" aria-checked="true" data-action="wrap"><span><span class="check-mark" id="wrapMark">✓</span>右端で折り返す</span><span></span></button>
        </div>
      </div>
    </nav>

    <section class="editor-wrap" aria-label="編集エリア">
      <label class="sr-only" for="editor">文章を入力</label>
      <textarea id="editor" spellcheck="false" autofocus aria-describedby="privacyDescription"></textarea>
      <p id="privacyDescription" class="sr-only">入力内容はこの端末のブラウザ内だけに保存され、外部には送信されません。</p>
    </section>

    <footer class="statusbar" aria-label="文書の状態">
      <span class="status-item" id="fileStatus">無題.txt</span>
      <span class="status-item" id="positionStatus">1 行、1 列</span>
      <span class="status-item" id="countStatus">0 文字</span>
      <span class="status-item" id="saveStatus">ブラウザに保存済み</span>
    </footer>
    <div class="disclaimer">学習・検証目的の非公式作品です。実在のソフトの開発元とは関係ありません。</div>
  </main>

  <input id="fileInput" type="file" accept=".txt,text/plain" hidden>

  <dialog id="searchDialog" aria-labelledby="searchDialogTitle">
    <h2 class="dialog-title" id="searchDialogTitle">検索と置換</h2>
    <div class="dialog-body">
      <label class="field">検索する文字列
        <input id="searchInput" type="text" autocomplete="off">
      </label>
      <label class="field" id="replaceField">置き換える文字列
        <input id="replaceInput" type="text" autocomplete="off">
      </label>
      <label class="check-row"><input id="matchCase" type="checkbox">大文字と小文字を区別する</label>
      <p class="dialog-note" id="searchNote" aria-live="polite"></p>
    </div>
    <div class="dialog-actions">
      <button type="button" data-search-action="next">次を検索</button>
      <button type="button" data-search-action="replace">置換</button>
      <button type="button" data-search-action="replaceAll">すべて置換</button>
      <button type="button" data-dialog-close="searchDialog">閉じる</button>
    </div>
  </dialog>

  <dialog id="fontDialog" aria-labelledby="fontDialogTitle">
    <h2 class="dialog-title" id="fontDialogTitle">フォントと文字サイズ</h2>
    <div class="dialog-body">
      <div class="field-row">
        <label class="field">フォント
          <select id="fontSelect">
            <option value="\"Yu Gothic UI\", \"Yu Gothic\", Meiryo, sans-serif">游ゴシック</option>
            <option value="Meiryo, sans-serif">メイリオ</option>
            <option value="\"Noto Sans JP\", sans-serif">ゴシック体</option>
            <option value="\"Yu Mincho\", \"Hiragino Mincho ProN\", serif">明朝体</option>
            <option value="ui-monospace, \"SFMono-Regular\", Consolas, monospace">等幅フォント</option>
          </select>
        </label>
        <label class="field">文字サイズ
          <input id="fontSize" type="number" inputmode="numeric" min="12" max="36" step="1" value="16">
        </label>
      </div>
      <div class="font-preview" id="fontPreview" aria-label="表示見本">あいうえお １２３<br>文章の表示見本です。</div>
      <p class="dialog-note">文字サイズは12〜36ピクセルの範囲で指定できます。</p>
    </div>
    <div class="dialog-actions">
      <button class="primary" type="button" id="applyFont">適用</button>
      <button type="button" data-dialog-close="fontDialog">キャンセル</button>
    </div>
  </dialog>

  <dialog id="saveDialog" aria-labelledby="saveDialogTitle">
    <h2 class="dialog-title" id="saveDialogTitle">テキストファイルとして保存</h2>
    <div class="dialog-body">
      <label class="field">ファイル名
        <input id="saveName" type="text" value="無題.txt" autocomplete="off">
      </label>
      <p class="dialog-note" id="saveNote">この端末にテキストファイルをダウンロードします。</p>
    </div>
    <div class="dialog-actions">
      <button class="primary" type="button" id="confirmSave">保存</button>
      <button type="button" data-dialog-close="saveDialog">キャンセル</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "tsukutte-tameso-editor-v1";
      const DEFAULT_FONT = '"Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif';
      const editor = document.getElementById("editor");
      const fileInput = document.getElementById("fileInput");
      const windowTitle = document.getElementById("windowTitle");
      const fileStatus = document.getElementById("fileStatus");
      const positionStatus = document.getElementById("positionStatus");
      const countStatus = document.getElementById("countStatus");
      const saveStatus = document.getElementById("saveStatus");
      const wrapMark = document.getElementById("wrapMark");
      const wrapMenuItem = document.querySelector('[data-action="wrap"]');
      const searchDialog = document.getElementById("searchDialog");
      const searchInput = document.getElementById("searchInput");
      const replaceInput = document.getElementById("replaceInput");
      const replaceField = document.getElementById("replaceField");
      const searchNote = document.getElementById("searchNote");
      const fontDialog = document.getElementById("fontDialog");
      const fontSelect = document.getElementById("fontSelect");
      const fontSize = document.getElementById("fontSize");
      const fontPreview = document.getElementById("fontPreview");
      const saveDialog = document.getElementById("saveDialog");
      const saveName = document.getElementById("saveName");
      const saveNote = document.getElementById("saveNote");
      const toast = document.getElementById("toast");

      let fileName = "無題.txt";
      let dirty = false;
      let wrapEnabled = true;
      let currentFont = DEFAULT_FONT;
      let currentFontSize = 16;
      let saveTimer = null;
      let historyTimer = null;
      let toastTimer = null;
      let history = [];
      let historyIndex = -1;
      let applyingHistory = false;

      function normalizeFileName(name) {
        const cleaned = String(name || "").trim().replace(/[\\/:*?"<>|]/g, "_");
        if (!cleaned) return "無題.txt";
        return cleaned.toLowerCase().endsWith(".txt") ? cleaned : `${cleaned}.txt`;
      }

      function getSnapshot() {
        return {
          value: editor.value,
          start: editor.selectionStart,
          end: editor.selectionEnd
        };
      }

      function sameSnapshot(a, b) {
        return Boolean(a && b && a.value === b.value);
      }

      function pushHistory() {
        clearTimeout(historyTimer);
        historyTimer = null;
        const snapshot = getSnapshot();
        if (sameSnapshot(history[historyIndex], snapshot)) {
          history[historyIndex] = snapshot;
          return;
        }
        history = history.slice(0, historyIndex + 1);
        history.push(snapshot);
        if (history.length > 120) history.shift();
        historyIndex = history.length - 1;
      }

      function scheduleHistory() {
        clearTimeout(historyTimer);
        historyTimer = setTimeout(pushHistory, 350);
      }

      function applyHistory(index) {
        const snapshot = history[index];
        if (!snapshot) return;
        applyingHistory = true;
        editor.value = snapshot.value;
        editor.setSelectionRange(snapshot.start, snapshot.end);
        historyIndex = index;
        applyingHistory = false;
        markDirty();
        updateStatus();
        editor.focus();
      }

      function undo() {
        pushHistory();
        if (historyIndex > 0) applyHistory(historyIndex - 1);
        else showToast("これ以上元に戻せません。");
      }

      function redo() {
        pushHistory();
        if (historyIndex < history.length - 1) applyHistory(historyIndex + 1);
        else showToast("これ以上やり直せません。");
      }

      function setInitialHistory() {
        clearTimeout(historyTimer);
        history = [getSnapshot()];
        historyIndex = 0;
      }

      function setDirty(nextDirty) {
        dirty = nextDirty;
        updateTitle();
      }

      function markDirty() {
        if (!applyingHistory) setDirty(true);
        saveStatus.textContent = "ブラウザに保存中…";
        scheduleBrowserSave();
      }

      function scheduleBrowserSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveToBrowser, 220);
      }

      function saveToBrowser() {
        clearTimeout(saveTimer);
        saveTimer = null;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            text: editor.value,
            fileName,
            dirty,
            wrapEnabled,
            font: currentFont,
            fontSize: currentFontSize,
            savedAt: Date.now()
          }));
          saveStatus.textContent = "ブラウザに保存済み";
        } catch (error) {
          saveStatus.textContent = "ブラウザ保存に失敗";
          showToast("ブラウザへの自動保存に失敗しました。");
        }
      }

      function restoreFromBrowser() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const state = JSON.parse(raw);
          editor.value = typeof state.text === "string" ? state.text : "";
          fileName = normalizeFileName(state.fileName);
          dirty = Boolean(state.dirty);
          wrapEnabled = state.wrapEnabled !== false;
          currentFont = typeof state.font === "string" ? state.font : DEFAULT_FONT;
          currentFontSize = Number.isFinite(Number(state.fontSize))
            ? Math.min(36, Math.max(12, Number(state.fontSize)))
            : 16;
          applyAppearance();
          updateAll();
          setInitialHistory();
          if (editor.value) showToast("前回の内容をブラウザから復元しました。");
          return true;
        } catch (error) {
          localStorage.removeItem(STORAGE_KEY);
          return false;
        }
      }

      function applyAppearance() {
        editor.style.fontFamily = currentFont;
        editor.style.fontSize = `${currentFontSize}px`;
        editor.classList.toggle("no-wrap", !wrapEnabled);
        wrapMark.textContent = wrapEnabled ? "✓" : "";
        wrapMenuItem.setAttribute("aria-checked", String(wrapEnabled));
      }

      function updateTitle() {
        const marker = dirty ? "*" : "";
        windowTitle.textContent = `${marker}${fileName} - つくってためそ メモ帳`;
        document.title = `${marker}${fileName} - つくってためそ メモ帳`;
        fileStatus.textContent = `${marker}${fileName}`;
      }

      function updateStatus() {
        const beforeCaret = editor.value.slice(0, editor.selectionStart);
        const lines = beforeCaret.split("\n");
        positionStatus.textContent = `${lines.length} 行、${lines[lines.length - 1].length + 1} 列`;
        countStatus.textContent = `${Array.from(editor.value).length.toLocaleString("ja-JP")} 文字`;
      }

      function updateAll() {
        updateTitle();
        updateStatus();
        applyAppearance();
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
      }

      function closeMenus() {
        document.querySelectorAll(".menu.open").forEach((menu) => {
          menu.classList.remove("open");
          menu.querySelector(".menu-trigger").setAttribute("aria-expanded", "false");
        });
      }

      function confirmDiscard() {
        return !dirty || window.confirm("未保存の変更があります。内容を破棄して続けますか？");
      }

      function newDocument() {
        if (!confirmDiscard()) return;
        editor.value = "";
        fileName = "無題.txt";
        setDirty(false);
        setInitialHistory();
        updateAll();
        saveToBrowser();
        editor.focus();
      }

      function openDocument() {
        if (!confirmDiscard()) return;
        fileInput.value = "";
        fileInput.click();
      }

      function showSaveDialog() {
        saveName.value = normalizeFileName(fileName);
        saveNote.textContent = "この端末にテキストファイルをダウンロードします。";
        saveNote.classList.remove("error");
        saveDialog.showModal();
        requestAnimationFrame(() => {
          saveName.focus();
          saveName.select();
        });
      }

      function downloadDocument() {
        fileName = normalizeFileName(saveName.value);
        saveName.value = fileName;
        const blob = new Blob([editor.value], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        setDirty(false);
        saveToBrowser();
        saveDialog.close();
        showToast(`${fileName} を保存しました。`);
        editor.focus();
      }

      function openSearchDialog(mode) {
        replaceField.hidden = mode === "find";
        searchDialog.querySelector('[data-search-action="replace"]').hidden = mode === "find";
        searchDialog.querySelector('[data-search-action="replaceAll"]').hidden = mode === "find";
        document.getElementById("searchDialogTitle").textContent = mode === "find" ? "検索" : "検索と置換";
        const selected = editor.value.slice(editor.selectionStart, editor.selectionEnd);
        if (selected && !selected.includes("\n")) searchInput.value = selected;
        searchNote.textContent = "";
        if (!searchDialog.open) searchDialog.showModal();
        requestAnimationFrame(() => {
          searchInput.focus();
          searchInput.select();
        });
      }

      function searchValues() {
        const query = searchInput.value;
        const source = editor.value;
        const caseSensitive = document.getElementById("matchCase").checked;
        return {
          query,
          source,
          haystack: caseSensitive ? source : source.toLocaleLowerCase("ja-JP"),
          needle: caseSensitive ? query : query.toLocaleLowerCase("ja-JP")
        };
      }

      function findNext(startAt = editor.selectionEnd) {
        const { query, haystack, needle } = searchValues();
        if (!query) {
          searchNote.textContent = "検索する文字列を入力してください。";
          searchNote.classList.add("error");
          searchInput.focus();
          return false;
        }
        let index = haystack.indexOf(needle, startAt);
        let wrapped = false;
        if (index < 0 && startAt > 0) {
          index = haystack.indexOf(needle, 0);
          wrapped = index >= 0;
        }
        if (index < 0) {
          searchNote.textContent = "見つかりませんでした。";
          searchNote.classList.add("error");
          return false;
        }
        editor.focus();
        editor.setSelectionRange(index, index + query.length);
        updateStatus();
        searchNote.textContent = wrapped ? "先頭に戻って見つけました。" : "見つかりました。";
        searchNote.classList.remove("error");
        return true;
      }

      function replaceCurrent() {
        const { query } = searchValues();
        if (!query) {
          findNext();
          return;
        }
        const selected = editor.value.slice(editor.selectionStart, editor.selectionEnd);
        const caseSensitive = document.getElementById("matchCase").checked;
        const matches = caseSensitive
          ? selected === query
          : selected.toLocaleLowerCase("ja-JP") === query.toLocaleLowerCase("ja-JP");
        if (!matches && !findNext()) return;
        editor.setRangeText(replaceInput.value, editor.selectionStart, editor.selectionEnd, "end");
        markDirty();
        pushHistory();
        updateStatus();
        findNext(editor.selectionEnd);
      }

      function replaceAll() {
        const { query, source, haystack, needle } = searchValues();
        if (!query) {
          searchNote.textContent = "検索する文字列を入力してください。";
          searchNote.classList.add("error");
          return;
        }
        let cursor = 0;
        let count = 0;
        let output = "";
        while (cursor <= source.length) {
          const index = haystack.indexOf(needle, cursor);
          if (index < 0) break;
          output += source.slice(cursor, index) + replaceInput.value;
          cursor = index + query.length;
          count += 1;
        }
        if (count === 0) {
          searchNote.textContent = "見つかりませんでした。";
          searchNote.classList.add("error");
          return;
        }
        output += source.slice(cursor);
        editor.value = output;
        editor.setSelectionRange(0, 0);
        markDirty();
        pushHistory();
        updateStatus();
        searchNote.textContent = `${count.toLocaleString("ja-JP")} 件置換しました。`;
        searchNote.classList.remove("error");
      }

      function openFontDialog() {
        fontSelect.value = Array.from(fontSelect.options).some((option) => option.value === currentFont)
          ? currentFont
          : DEFAULT_FONT;
        fontSize.value = currentFontSize;
        updateFontPreview();
        fontDialog.showModal();
      }

      function updateFontPreview() {
        const size = Math.min(36, Math.max(12, Number(fontSize.value) || 16));
        fontPreview.style.fontFamily = fontSelect.value;
        fontPreview.style.fontSize = `${size}px`;
      }

      function applyFont() {
        currentFont = fontSelect.value;
        currentFontSize = Math.min(36, Math.max(12, Number(fontSize.value) || 16));
        fontSize.value = currentFontSize;
        applyAppearance();
        saveToBrowser();
        fontDialog.close();
        editor.focus();
      }

      function toggleWrap() {
        wrapEnabled = !wrapEnabled;
        applyAppearance();
        saveToBrowser();
        editor.focus();
      }

      const actions = {
        new: newDocument,
        open: openDocument,
        save: showSaveDialog,
        undo,
        redo,
        find: () => openSearchDialog("find"),
        replace: () => openSearchDialog("replace"),
        selectAll: () => {
          editor.focus();
          editor.select();
          updateStatus();
        },
        font: openFontDialog,
        wrap: toggleWrap
      };

      document.querySelectorAll(".menu-trigger").forEach((trigger) => {
        trigger.addEventListener("click", (event) => {
          event.stopPropagation();
          const menu = trigger.closest(".menu");
          const willOpen = !menu.classList.contains("open");
          closeMenus();
          if (willOpen) {
            menu.classList.add("open");
            trigger.setAttribute("aria-expanded", "true");
          }
        });
      });

      document.querySelectorAll("[data-action]").forEach((item) => {
        item.addEventListener("click", () => {
          const action = actions[item.dataset.action];
          closeMenus();
          if (action) action();
        });
      });

      document.querySelectorAll("[data-dialog-close]").forEach((button) => {
        button.addEventListener("click", () => document.getElementById(button.dataset.dialogClose).close());
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".menu")) closeMenus();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeMenus();
        const modifier = event.ctrlKey || event.metaKey;
        if (!modifier) return;
        const key = event.key.toLowerCase();
        const shortcutActions = {
          n: newDocument,
          o: openDocument,
          s: showSaveDialog,
          f: () => openSearchDialog("find"),
          h: () => openSearchDialog("replace"),
          y: redo
        };
        if (key === "z") {
          event.preventDefault();
          event.shiftKey ? redo() : undo();
          return;
        }
        if (shortcutActions[key]) {
          event.preventDefault();
          shortcutActions[key]();
        }
      });

      editor.addEventListener("input", () => {
        setDirty(true);
        updateStatus();
        scheduleHistory();
        scheduleBrowserSave();
      });

      ["click", "keyup", "select", "focus"].forEach((eventName) => {
        editor.addEventListener(eventName, updateStatus);
      });

      editor.addEventListener("keydown", (event) => {
        if (event.key === "Tab") {
          event.preventDefault();
          editor.setRangeText("\t", editor.selectionStart, editor.selectionEnd, "end");
          markDirty();
          pushHistory();
          updateStatus();
        }
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        try {
          editor.value = await file.text();
          fileName = normalizeFileName(file.name);
          setDirty(false);
          setInitialHistory();
          updateAll();
          saveToBrowser();
          showToast(`${fileName} を開きました。`);
          editor.focus();
        } catch (error) {
          showToast("ファイルを開けませんでした。");
        }
      });

      document.querySelectorAll("[data-search-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const action = button.dataset.searchAction;
          if (action === "next") findNext();
          if (action === "replace") replaceCurrent();
          if (action === "replaceAll") replaceAll();
        });
      });

      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          findNext();
        }
      });

      fontSelect.addEventListener("change", updateFontPreview);
      fontSize.addEventListener("input", updateFontPreview);
      document.getElementById("applyFont").addEventListener("click", applyFont);
      document.getElementById("confirmSave").addEventListener("click", downloadDocument);
      saveName.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          downloadDocument();
        }
      });

      [searchDialog, fontDialog, saveDialog].forEach((dialog) => {
        dialog.addEventListener("click", (event) => {
          if (event.target === dialog) dialog.close();
        });
      });

      window.addEventListener("beforeunload", (event) => {
        saveToBrowser();
        if (dirty) {
          event.preventDefault();
          event.returnValue = "";
        }
      });

      if (!restoreFromBrowser()) {
        applyAppearance();
        updateAll();
        setInitialHistory();
        saveToBrowser();
      }
      editor.focus();
    })();
  </script>
</body>
</html>
